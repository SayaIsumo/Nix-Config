name: Build NixOS system

on:
  pull_request:
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Must run before Nix is installed, as it sets up /nix on the freed space.
      # Pinned to main: v11 predates the installer fix (upstream issue #57).
      - uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            build-dir = /nix/build

      - name: Build system
        run: nix build .#nixosConfigurations.nixos.config.system.build.toplevel --print-build-logs

      # Informational only: a broken main shouldn't fail this branch's build.
      - name: Show package changes compared to main
        continue-on-error: true
        run: |
          nix build "github:$GITHUB_REPOSITORY/main#nixosConfigurations.nixos.config.system.build.toplevel" --out-link base
          {
            echo '### Package changes compared to main'
            echo '```'
            nix run nixpkgs#nvd -- --color never diff ./base ./result
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Merge the weekly flake.lock update PR once its build has passed.
  # update-flake.yml starts this workflow on that branch via workflow_dispatch.
  # Runs only on that branch, and only if the build job succeeded, so a
  # failing update stays open for manual review.
  automerge-flake-update:
    needs: build
    if: github.ref_name == 'update_flake_lock_action' || github.head_ref == 'update_flake_lock_action'
    runs-on: ubuntu-latest
    permissions:
      contents: write # merge into main
      pull-requests: write # merge the PR
    steps:
      # --match-head-commit refuses the merge if the branch moved after this
      # build started, so only the commit that was actually built gets merged.
      - name: Merge the flake.lock update PR
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh pr merge update_flake_lock_action --repo "$GITHUB_REPOSITORY" \
            --merge --delete-branch \
            --match-head-commit "$BUILT_SHA"
