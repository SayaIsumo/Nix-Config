name: Build NixOS system

on:
  pull_request:
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Must run before Nix is installed, as it sets up /nix on the freed space.
      # Pinned to main: v11 predates the installer fix (upstream issue #57).
      - uses: wimpysworld/nothing-but-nix@60cdb933914c3413bfc222f3a083880296cc3c95
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            build-dir = /nix/build

      - name: Build system
        run: nix build .#nixosConfigurations.nixos.config.system.build.toplevel --print-build-logs

      # Informational only: a broken main shouldn't fail this branch's build.
      - name: Show package changes compared to main
        continue-on-error: true
        run: |
          nix build "github:$GITHUB_REPOSITORY/main#nixosConfigurations.nixos.config.system.build.toplevel" --out-link base
          {
            echo '### Package changes compared to main'
            echo '```'
            nix run nixpkgs#nvd -- --color never diff ./base ./result
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
